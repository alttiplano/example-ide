[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/alttiplano/example-ide"

[workspace.dependencies]
ide-brand = { path = "crates/brand" }
ide-ui = { path = "crates/ui" }
eframe = "0.37"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "thin"

# Code-quality rules shared by every crate (each crate opts in with `[lints] workspace = true`).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
wildcard_imports = "warn"
too_many_arguments = "warn"
cognitive_complexity = "warn"
