[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/alttiplano/example-ide"

[workspace.dependencies]
ide-brand = { path = "crates/brand" }
ide-ui = { path = "crates/ui" }
eframe = "0.37"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "thin"
